<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="tdDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tdBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0F62FE"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="tdHighlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F62FE" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="106" rx="42" ry="10" fill="url(#tdDropShadow)"/>

  <!-- 3D Rounded Cube / Device Base -->
  <g filter="url(#tdGlow)">
    <!-- Base Body with Bevel -->
    <rect x="20" y="16" width="80" height="80" rx="22" fill="url(#tdBodyGrad)"/>
    <!-- Top Rim Specular Glare -->
    <rect x="22" y="18" width="76" height="38" rx="20" fill="url(#tdHighlightGrad)"/>
  </g>

  <!-- 3D Cassette & Scripture Waveform Emblem -->
  <g transform="translate(60, 56) scale(0.48)">
    <rect x="-58" y="-40" width="116" height="80" rx="10" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    <circle cx="-58" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="58" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="-58" cy="0" r="7" fill="#0F62FE"/>
    <circle cx="58" cy="0" r="7" fill="#0F62FE"/>
    <!-- Waveform & Text lines -->
    <rect x="-42" y="-20" width="56" height="7" rx="3" fill="#0F62FE"/>
    <rect x="-42" y="-4" width="56" height="7" rx="3" fill="#0F62FE"/>
    <rect x="-42" y="12" width="34" height="7" rx="3" fill="#0F62FE"/>
    <!-- Audio Equalizer Bars -->
    <rect x="22" y="-22" width="6" height="14" rx="2" fill="#00D2FF"/>
    <rect x="32" y="-30" width="6" height="28" rx="2" fill="#00D2FF"/>
    <rect x="42" y="-18" width="6" height="14" rx="2" fill="#00D2FF"/>
  </g>
</svg>

