<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Avatares e Inteligencia Artificial 3D">
  <defs>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="aiAvatarHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="aiRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Sombra de Suelo -->
  <ellipse cx="50" cy="88" rx="34" ry="7" fill="#0F172A" opacity="0.3"/>

  <!-- Anillo Orbital Holográfico Base -->
  <ellipse cx="50" cy="80" rx="30" ry="8" stroke="url(#aiRingGrad)" stroke-width="2.5" opacity="0.65"/>

  <!-- Silueta de Avatar Digital Tridimensional (Cuerpo / Hombros con Facetas) -->
  <path d="M 24 76 C 24 64 34 58 50 58 C 66 58 76 64 76 76 Z" fill="#1E1B4B" opacity="0.8"/>
  <path d="M 26 74 C 26 63 35 57 50 57 C 65 57 74 63 74 74 Z" fill="url(#aiAvatarHeadGrad)" opacity="0.9" filter="url(#avatarShadow)"/>

  <!-- Cabeza Volumétrica de Avatar con Facetas de IA -->
  <ellipse cx="50" cy="38" rx="16" ry="20" fill="#172554"/>
  <ellipse cx="50" cy="36" rx="16" ry="20" fill="url(#aiAvatarHeadGrad)" filter="url(#avatarShadow)"/>

  <!-- Brillo Especular en Cabeza -->
  <path d="M 44 22 C 52 22 56 26 58 30" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Red Neuronal / Conectores Holográficos en Rostro -->
  <circle cx="43" cy="36" r="2.5" fill="#06B6D4"/>
  <circle cx="57" cy="36" r="2.5" fill="#06B6D4"/>
  <path d="M 46 44 Q 50 47 54 44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Partículas / Ondas de IA Inteligente Flotantes -->
  <circle cx="22" cy="32" r="3" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="78" cy="28" r="3.5" fill="#06B6D4" opacity="0.8"/>
  <circle cx="72" cy="50" r="2" fill="#C084FC" opacity="0.7"/>
  <line x1="22" y1="32" x2="36" y2="35" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="78" y1="28" x2="64" y2="34" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
</svg>

