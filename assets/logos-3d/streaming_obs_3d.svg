<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Streaming Profesional y OBS Studio 3D">
  <defs>
    <filter id="streamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="streamGradBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="streamGradLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="streamGradBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Sombra de Suelo -->
  <ellipse cx="50" cy="88" rx="34" ry="7" fill="#0F172A" opacity="0.3"/>

  <!-- Cuerpo de Cámara 3D (Capa de Extrusión Trasera) -->
  <rect x="18" y="32" width="46" height="38" rx="8" fill="#172554"/>

  <!-- Cuerpo Frontal de Cámara 3D -->
  <rect x="18" y="28" width="46" height="38" rx="8" fill="url(#streamGradBase)" filter="url(#streamShadow)"/>

  <!-- Brillo Especular Borde Superior -->
  <path d="M 22 29 L 60 29" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>

  <!-- Cono / Lente Frontal 3D -->
  <path d="M 64 38 L 84 26 L 84 68 L 64 56 Z" fill="#1E3A8A"/>
  <path d="M 64 36 L 84 24 L 84 66 L 64 54 Z" fill="url(#streamGradBevel)"/>
  <path d="M 84 24 L 84 66" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

  <!-- Lente Circular Central con Profundidad -->
  <circle cx="41" cy="47" r="14" fill="#0F172A"/>
  <circle cx="41" cy="47" r="12" fill="url(#streamGradLens)"/>
  <circle cx="37" cy="43" r="4" fill="rgba(255,255,255,0.7)"/>

  <!-- Indicador LIVE / Señal Broadcast 3D -->
  <rect x="24" y="16" width="22" height="9" rx="4" fill="#EF4444" filter="url(#streamShadow)"/>
  <circle cx="28" cy="20.5" r="2" fill="#FFFFFF"/>
  <text x="32" y="23" font-family="'Inter', sans-serif" font-size="5" font-weight="800" fill="#FFFFFF">LIVE</text>
  
  <!-- Ondas de Señal Broadcast -->
  <path d="M 66 18 Q 72 23 72 30" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 70 14 Q 78 21 78 30" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>

