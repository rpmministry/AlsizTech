  </defs>
  <ellipse cx="60" cy="102" rx="44" ry="10" fill="url(#flShadow)"/>
  <!-- 3D Folded Wing Top -->
  <g filter="drop-shadow(0 6px 6px rgba(0,0,0,0.25))">
    <path d="M 74 16 L 28 62 L 46 80 L 92 34 Z" fill="url(#flTopRibbon)"/>
