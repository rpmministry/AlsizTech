<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="wsDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="wsEmblem3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="wsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="wsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="wsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="wsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wsViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="106" rx="42" ry="10" fill="url(#wsDropShadow)"/>

  <!-- 3D Geometric Petals Group -->
  <g transform="translate(18, 14) scale(0.66)" filter="url(#wsEmblem3d)">
    <!-- Top Left - Leaf Green -->
    <path d="M 16 56 L 16 24 C 33.67 24 48 38.33 48 56 Z" fill="url(#wsGreen)"/>
    <!-- Bottom Left - Crimson Coral Red -->
    <path d="M 16 56 H 48 V 88 C 30.33 88 16 73.67 16 56 Z" fill="url(#wsRed)"/>
    <!-- Center Bottom - Radiant Orange Quarter Arc -->
    <path d="M 48 88 V 56 C 65.67 56 80 70.33 80 88 Z" fill="url(#wsOrange)"/>
    <!-- Top Right - Sky Cyan -->
    <path d="M 112 56 H 80 C 80 38.33 94.33 24 112 24 Z" fill="url(#wsCyan)"/>
    <!-- Bottom Right - Royal Violet Purple -->
    <path d="M 80 56 H 112 C 112 73.67 97.67 88 80 88 Z" fill="url(#wsViolet)"/>
  </g>
</svg>

