name: Despliegue Continuo a Producción - AlsizTech

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue Automático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar y Sincronizar Archivos
        run: |
          node sync.js

      - name: Despliegue a Hosting FTP (cPanel / Hostinger)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            leads.json
            server.js
            generate_3d_logos.js
            .env*
